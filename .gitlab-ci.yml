################################
# APPLY DATABASE SCHEMA
################################

apply-schema:
  stage: schema
  image: postgres:16
  tags:
    - deploy
  before_script:
    - |
      test -f .env || {
        echo "Required .env file is missing" >&2
        exit 1
      }
      test -s db/schema.sql || {
        echo "Required db/schema.sql file is missing or empty" >&2
        exit 1
      }

      export PGHOST="$(sed -n 's/^PG_HOST=//p' .env | tail -n 1 | tr -d '\r')"
      export PGPORT="$(sed -n 's/^PG_PORT=//p' .env | tail -n 1 | tr -d '\r')"
      export PGDATABASE="$(sed -n 's/^PG_DB=//p' .env | tail -n 1 | tr -d '\r')"
      export PGUSER="$(sed -n 's/^PG_USER=//p' .env | tail -n 1 | tr -d '\r')"
      export PGPASSWORD="$(sed -n 's/^PG_PASSWORD=//p' .env | tail -n 1 | tr -d '\r')"
      export PG_SCHEMA="$(sed -n 's/^PG_SCHEMA=//p' .env | tail -n 1 | tr -d '\r')"
      export PGCONNECT_TIMEOUT=10

      for variable_name in PGHOST PGPORT PGDATABASE PGUSER PGPASSWORD PG_SCHEMA; do
        eval "variable_value=\${$variable_name}"
        test -n "$variable_value" || {
          echo "Required PostgreSQL setting is missing in .env: $variable_name" >&2
          exit 1
        }
      done
  script:
    - echo "Applying db/schema.sql before backend deployment"
    - psql --no-password --set=ON_ERROR_STOP=1 --set=app_schema="$PG_SCHEMA" --single-transaction --file=db/schema.sql
  environment:
    name: production
    action: prepare
  #needs:
   # - job: test-api
     # artifacts: false
   # - job: verify-signature
      #artifacts: false
  only:
    - main

################################
# DEPLOY
################################

k8s-deploy:
  stage: deploy

  image:
    name: $CI_REGISTRY/lifecycle-automation/devsecops-tools/build-components/build-images/ansible:6.7.0-v1
    entrypoint: [""]

  variables:
    KUBECONFIG: ./config

  before_script:
    - kubectl config --kubeconfig=config set-cluster k8s --server="$KUBE_URL" --insecure-skip-tls-verify=true
    - kubectl config --kubeconfig=config set-credentials deployer --token="$KUBE_TOKEN"
    - kubectl config --kubeconfig=config set-context k8s --cluster=k8s --user=deployer
    - kubectl config --kubeconfig=config use-context k8s

  script:

    - echo Deploying ai-km-service

    - kubectl apply -f k8s-manifest/configmap.yaml -n $NAMESPACE

    - kubectl apply -f k8s-manifest/deployment-api.yaml -n $NAMESPACE
    - kubectl apply -f k8s-manifest/service-api.yaml -n $NAMESPACE

    - kubectl set image deployment/nnp-km-backend-local-llm api=${IMAGE_NAME_API}:${IMAGE_TAG} -n $NAMESPACE


    - kubectl rollout restart deployment/nnp-km-backend-local-llm -n $NAMESPACE


    - kubectl rollout status deployment/nnp-km-backend-local-llm -n $NAMESPACE --timeout=25m


  environment:
    name: production
    kubernetes:
      namespace: "$NAMESPACE"

  needs:
    - job: apply-schema
      artifacts: false

  only:
    - main

  tags:
    - deploy
