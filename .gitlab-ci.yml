variables:
  IMAGE_NAME_API: $DOCKER_REGISTRY/nnp-km-backend-local-llm
  IMAGE_TAG: $CI_COMMIT_SHORT_SHA
  NAMESPACE: nnp-core-components

################################
# BUILD IMAGE
################################

build-api:
  stage: build
  tags:
    - nubons-default-runne
  image:
    name: $CI_REGISTRY/lifecycle-automation/devsecops-tools/build-components/build-images/kaniko-executor:v1.25.1
    entrypoint: [""]
  script:
    - echo "Building API image"
    - mkdir -p /kaniko/.docker
    - echo "{\"auths\":{\"https://index.docker.io/v1/\":{\"username\":\"$DOCKERHUB_REGISTRY_USER\",\"password\":\"$DOCKER_HUB_PASS\"}}}" > /kaniko/.docker/config.json
    - |
      /kaniko/executor \
        --context ${CI_PROJECT_DIR} \
        --dockerfile ${CI_PROJECT_DIR}/Dockerfile.api \
        --destination ${IMAGE_NAME_API}:${IMAGE_TAG} \
        --destination ${IMAGE_NAME_API}:latest \
        --digest-file image-digest.txt \
        --cache=false
  artifacts:
    paths:
      - image-digest.txt
  only:
    - main
    - develop
    - tags

