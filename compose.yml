# Local-dev convenience (NEW): Postgres + the API.
# Postgres auto-runs db/schema.sql on first start (creates the
# "nnp-rag" schema and all tables).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${PG_DB:?Set PG_DB in .env}
      POSTGRES_USER: ${PG_USER:?Set PG_USER in .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DB: ${PG_DB:?Set PG_DB in .env}
      PG_USER: ${PG_USER:?Set PG_USER in .env}
      PG_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      PG_SCHEMA: ${PG_SCHEMA:?Set PG_SCHEMA in .env}
      LOG_LEVEL: INFO
      PROVISION_ENABLED: "false"
      INGESTION_ENABLED: "false"
    ports:
      - "8000:8000"

volumes:
  pgdata:
